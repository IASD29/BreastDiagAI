<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="700" height="450" rx="16" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#831843">
    Distribution du Rayon Moyen (Radius Mean)
  </text>
  <text x="40" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">
    Comparaison des densités de probabilité entre lésions Bénignes (Vert) et Malignes (Rouge)
  </text>

  <!-- Legend -->
  <g transform="translate(460, 35)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10B981" opacity="0.8"/>
    <text x="20" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#065F46">Bénin (médiane ~12.1 mm)</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="#EF4444" opacity="0.8"/>
    <text x="20" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#991B1B">Malin (médiane ~17.5 mm)</text>
  </g>

  <!-- Chart Grid Area -->
  <g stroke="#F1F5F9" stroke-width="1">
    <line x1="80" y1="360" x2="640" y2="360" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="80" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="240" x2="640" y2="240"/>
    <line x1="80" y1="180" x2="640" y2="180"/>
    <line x1="80" y1="120" x2="640" y2="120"/>
  </g>

  <!-- Y-Axis Values -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">
    <text x="70" y="364">0</text>
    <text x="70" y="304">25</text>
    <text x="70" y="244">50</text>
    <text x="70" y="184">75</text>
    <text x="70" y="124">100</text>
  </g>

  <!-- Threshold Critical Line (Seuil ~15 mm) -->
  <line x1="330" y1="110" x2="330" y2="360" stroke="#E11D48" stroke-dasharray="5,4" stroke-width="2"/>
  <rect x="270" y="85" width="120" height="22" rx="4" fill="#FFE4E6"/>
  <text x="330" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#BE123C" text-anchor="middle">
    Zone charnière ~15.0 mm
  </text>

  <!-- Histogram Bars for Benign (Vert doux) -->
  <g fill="#10B981" opacity="0.75">
    <rect x="100" y="340" width="30" height="20" rx="3"/>
    <rect x="135" y="300" width="30" height="60" rx="3"/>
    <rect x="170" y="200" width="30" height="160" rx="3"/>
    <rect x="205" y="130" width="30" height="230" rx="3"/>
    <rect x="240" y="170" width="30" height="190" rx="3"/>
    <rect x="275" y="260" width="30" height="100" rx="3"/>
    <rect x="310" y="320" width="30" height="40" rx="3"/>
    <rect x="345" y="350" width="30" height="10" rx="3"/>
  </g>

  <!-- Histogram Bars for Malignant (Rouge doux) -->
  <g fill="#EF4444" opacity="0.75">
    <rect x="240" y="345" width="30" height="15" rx="3"/>
    <rect x="275" y="310" width="30" height="50" rx="3"/>
    <rect x="310" y="250" width="30" height="110" rx="3"/>
    <rect x="345" y="190" width="30" height="170" rx="3"/>
    <rect x="380" y="160" width="30" height="200" rx="3"/>
    <rect x="415" y="220" width="30" height="140" rx="3"/>
    <rect x="450" y="270" width="30" height="90" rx="3"/>
    <rect x="485" y="315" width="30" height="45" rx="3"/>
    <rect x="520" y="340" width="30" height="20" rx="3"/>
    <rect x="555" y="350" width="30" height="10" rx="3"/>
  </g>

  <!-- X-Axis Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
    <text x="115" y="380">8 mm</text>
    <text x="185" y="380">11 mm</text>
    <text x="255" y="380">13 mm</text>
    <text x="330" y="380" font-weight="700" fill="#BE123C">15 mm</text>
    <text x="395" y="380">18 mm</text>
    <text x="465" y="380">21 mm</text>
    <text x="535" y="380">24 mm</text>
    <text x="570" y="380">27 mm</text>
  </g>

  <text x="360" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">
    Rayon moyen des cellules nucléaires (radius_mean)
  </text>
</svg>
