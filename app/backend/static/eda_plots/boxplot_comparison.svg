<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="700" height="450" rx="16" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="2" filter="url(#boxShadow)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#831843">
    Comparaison Boxplot : Aire Maximale (Area Worst)
  </text>
  <text x="40" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">
    Dispersion statistique, quartiles (Q1, médiane, Q3) et valeurs extrêmes selon le diagnostic
  </text>

  <!-- Chart Grid -->
  <g stroke="#F1F5F9" stroke-width="1">
    <line x1="100" y1="360" x2="620" y2="360" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="100" y1="290" x2="620" y2="290"/>
    <line x1="100" y1="220" x2="620" y2="220"/>
    <line x1="100" y1="150" x2="620" y2="150"/>
    <line x1="100" y1="80" x2="620" y2="80"/>
  </g>

  <!-- Y-Axis labels (Area Worst in mm²) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">
    <text x="90" y="365">0</text>
    <text x="90" y="295">500</text>
    <text x="90" y="225">1000</text>
    <text x="90" y="155">1500</text>
    <text x="90" y="85">2000 mm²</text>
  </g>

  <!-- BENIGN BOXPLOT (Left) -->
  <!-- Whiskers -->
  <line x1="240" y1="340" x2="240" y2="260" stroke="#059669" stroke-width="2"/>
  <line x1="210" y1="340" x2="270" y2="340" stroke="#059669" stroke-width="2"/>
  <line x1="210" y1="260" x2="270" y2="260" stroke="#059669" stroke-width="2"/>
  
  <!-- Box (Q1=290, Q3=320, Median=305) -->
  <rect x="180" y="275" width="120" height="50" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <line x1="180" y1="298" x2="300" y2="298" stroke="#047857" stroke-width="3"/>
  <text x="240" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">Médiane: 550 mm²</text>

  <!-- Benign Outliers -->
  <circle cx="240" cy="240" r="4" fill="#10B981" opacity="0.6"/>
  <circle cx="240" cy="225" r="4" fill="#10B981" opacity="0.6"/>

  <!-- Benign Label -->
  <rect x="190" y="380" width="100" height="28" rx="6" fill="#ECFDF5"/>
  <text x="240" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">
    Bénin (n=357)
  </text>

  <!-- MALIGNANT BOXPLOT (Right) -->
  <!-- Whiskers -->
  <line x1="480" y1="280" x2="480" y2="90" stroke="#DC2626" stroke-width="2"/>
  <line x1="450" y1="280" x2="510" y2="280" stroke="#DC2626" stroke-width="2"/>
  <line x1="450" y1="90" x2="510" y2="90" stroke="#DC2626" stroke-width="2"/>
  
  <!-- Box (Q1=220, Q3=130, Median=165) -->
  <rect x="420" y="130" width="120" height="110" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <line x1="420" y1="165" x2="540" y2="165" stroke="#B91C1C" stroke-width="3"/>
  <text x="480" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#B91C1C" text-anchor="middle">Médiane: 1420 mm²</text>

  <!-- Malignant Label -->
  <rect x="430" y="380" width="100" height="28" rx="6" fill="#FEF2F2"/>
  <text x="480" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991B1B" text-anchor="middle">
    Malin (n=212)
  </text>
</svg>
