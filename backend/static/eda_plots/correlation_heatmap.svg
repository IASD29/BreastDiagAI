<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="700" height="500" rx="16" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#831843">
    Matrice de Corrélation des Biomarqueurs
  </text>
  <text x="40" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">
    Dataset Wisconsin Diagnostic Breast Cancer (WDBC) • Analyse multi-paramètres
  </text>

  <!-- Axis labels (Top / X) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">
    <text x="210" y="105">Radius M.</text>
    <text x="290" y="105">Area Worst</text>
    <text x="370" y="105">Radius W.</text>
    <text x="450" y="105">Texture M.</text>
    <text x="530" y="105">Concavity</text>
  </g>

  <!-- Axis labels (Left / Y) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="end">
    <text x="160" y="155">Radius Mean</text>
    <text x="160" y="225">Area Worst</text>
    <text x="160" y="295">Radius Worst</text>
    <text x="160" y="365">Texture Mean</text>
    <text x="160" y="435">Concavity Mean</text>
  </g>

  <!-- Heatmap Matrix Cells (5x5) -->
  <!-- Row 1: Radius Mean -->
  <rect x="175" y="125" width="70" height="60" rx="6" fill="#9D174D"/>
  <text x="210" y="160" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1.00</text>

  <rect x="255" y="125" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="290" y="160" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.94</text>

  <rect x="335" y="125" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="370" y="160" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.97</text>

  <rect x="415" y="125" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="450" y="160" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.32</text>

  <rect x="495" y="125" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="530" y="160" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.68</text>

  <!-- Row 2: Area Worst -->
  <rect x="175" y="195" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="210" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.94</text>

  <rect x="255" y="195" width="70" height="60" rx="6" fill="#9D174D"/>
  <text x="290" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1.00</text>

  <rect x="335" y="195" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="370" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.98</text>

  <rect x="415" y="195" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="450" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.34</text>

  <rect x="495" y="195" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="530" y="230" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.71</text>

  <!-- Row 3: Radius Worst -->
  <rect x="175" y="265" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="210" y="300" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.97</text>

  <rect x="255" y="265" width="70" height="60" rx="6" fill="#BE185D"/>
  <text x="290" y="300" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.98</text>

  <rect x="335" y="265" width="70" height="60" rx="6" fill="#9D174D"/>
  <text x="370" y="300" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1.00</text>

  <rect x="415" y="265" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="450" y="300" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.36</text>

  <rect x="495" y="265" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="530" y="300" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.69</text>

  <!-- Row 4: Texture Mean -->
  <rect x="175" y="335" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="210" y="370" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.32</text>

  <rect x="255" y="335" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="290" y="370" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.34</text>

  <rect x="335" y="335" width="70" height="60" rx="6" fill="#FCE7F3"/>
  <text x="370" y="370" font-family="monospace" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">0.36</text>

  <rect x="415" y="335" width="70" height="60" rx="6" fill="#9D174D"/>
  <text x="450" y="370" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1.00</text>

  <rect x="495" y="335" width="70" height="60" rx="6" fill="#FDF2F8"/>
  <text x="530" y="370" font-family="monospace" font-size="13" font-weight="bold" fill="#BE185D" text-anchor="middle">0.30</text>

  <!-- Row 5: Concavity Mean -->
  <rect x="175" y="405" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="210" y="440" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.68</text>

  <rect x="255" y="405" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="290" y="440" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.71</text>

  <rect x="335" y="405" width="70" height="60" rx="6" fill="#F472B6"/>
  <text x="370" y="440" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0.69</text>

  <rect x="415" y="405" width="70" height="60" rx="6" fill="#FDF2F8"/>
  <text x="450" y="440" font-family="monospace" font-size="13" font-weight="bold" fill="#BE185D" text-anchor="middle">0.30</text>

  <rect x="495" y="405" width="70" height="60" rx="6" fill="#9D174D"/>
  <text x="530" y="440" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1.00</text>

  <!-- Legend Scale on Right -->
  <g transform="translate(600, 150)">
    <rect x="0" y="0" width="16" height="260" rx="4" fill="url(#roseGradient)"/>
    <text x="26" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">0.0 (Faible)</text>
    <text x="26" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">0.5</text>
    <text x="26" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">1.0 (Forte)</text>
  </g>
</svg>
